# CI/CD Trigger Comment - Forced Refresh (March 26, 2026, 15:17)
name: Deploy Demo

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Linting Check
        working-directory: web
        run: npm run lint
        continue-on-error: true # Allow deployment even if lint errors exist for now

      - name: Create .env file
        env:
          FB_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          FB_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          FB_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          FB_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          FB_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          FB_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        working-directory: web
        run: |
          echo "VITE_FIREBASE_API_KEY=$FB_API_KEY" > .env
          echo "VITE_FIREBASE_AUTH_DOMAIN=$FB_AUTH_DOMAIN" >> .env
          echo "VITE_FIREBASE_PROJECT_ID=primeseva-mvp" >> .env
          echo "VITE_FIREBASE_STORAGE_BUCKET=$FB_STORAGE_BUCKET" >> .env
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=$FB_SENDER_ID" >> .env
          echo "VITE_FIREBASE_APP_ID=$FB_APP_ID" >> .env

      - name: Build
        working-directory: web
        run: npm run build

      - name: Lighthouse Audit
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://primeseva-mvp.web.app/
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: './lighthouserc.json'
        continue-on-error: true

      - name: Secure Environment (Cleanup)
        working-directory: web
        run: rm .env

      - name: Deploy to Firebase Hosting
        working-directory: web
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npx firebase-tools deploy --only hosting --project primeseva-mvp --token "$FIREBASE_TOKEN"

