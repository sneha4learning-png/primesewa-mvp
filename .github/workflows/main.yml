# CI/CD Pipeline - PrimeSewa MVP  (June 11, 2026 - v2 live-streaming build)
name: 🚀 Deploy PrimeSewa

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reason:
        description: 'Manual trigger reason'
        required: false
        default: 'Manual deployment'

# Kill any previous in-progress run on the same branch immediately
# so only ONE run is active at a time — this fixes stale "in progress" badges
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

# Required for live log streaming and deployment status API
permissions:
  contents: read
  deployments: write
  statuses: write

jobs:
  deploy:
    name: 🏗️ Build & Deploy to Firebase
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ─── 1. Checkout ────────────────────────────────────────────────────────
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # ─── 2. Node Setup ──────────────────────────────────────────────────────
      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      # ─── 3. Install ─────────────────────────────────────────────────────────
      - name: 📦 Install Dependencies
        working-directory: web
        run: |
          echo "::group::npm ci output"
          npm ci
          echo "::endgroup::"

      # ─── 4. Lint ────────────────────────────────────────────────────────────
      - name: 🔍 Linting Check
        working-directory: web
        run: |
          echo "::group::ESLint output"
          npm run lint || true
          echo "::endgroup::"
        continue-on-error: true

      # ─── 5. Env File ────────────────────────────────────────────────────────
      - name: 🔐 Create .env File
        env:
          FB_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          FB_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          FB_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          FB_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          FB_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          FB_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        working-directory: web
        run: |
          echo "VITE_FIREBASE_API_KEY=$FB_API_KEY" > .env
          echo "VITE_FIREBASE_AUTH_DOMAIN=$FB_AUTH_DOMAIN" >> .env
          echo "VITE_FIREBASE_PROJECT_ID=primeseva-mvp" >> .env
          echo "VITE_FIREBASE_STORAGE_BUCKET=$FB_STORAGE_BUCKET" >> .env
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=$FB_SENDER_ID" >> .env
          echo "VITE_FIREBASE_APP_ID=$FB_APP_ID" >> .env
          echo "✅ .env file created successfully"

      # ─── 6. Build ───────────────────────────────────────────────────────────
      - name: 🔨 Build Production Bundle
        working-directory: web
        run: |
          echo "::group::Vite build output"
          npm run build
          echo "::endgroup::"
          echo "✅ Build complete"

      # ─── 7. Lighthouse ──────────────────────────────────────────────────────
      - name: 🏆 Lighthouse Performance Audit
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://primeseva-mvp.web.app/
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: './lighthouserc.json'
        continue-on-error: true

      # ─── 8. Cleanup ─────────────────────────────────────────────────────────
      - name: 🧹 Secure Environment Cleanup
        working-directory: web
        run: |
          rm -f .env
          echo "✅ Secrets cleaned"

      # ─── 9. Deploy ──────────────────────────────────────────────────────────
      - name: 🚀 Deploy to Firebase Hosting
        working-directory: web
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          echo "::group::Firebase deploy output"
          npx firebase-tools deploy --project primeseva-mvp --token "$FIREBASE_TOKEN"
          echo "::endgroup::"

      # ─── 10. Job Summary (shows in GitHub UI without refresh) ───────────────
      - name: 📊 Write Job Summary
        if: always()
        run: |
          echo "## 🚀 PrimeSewa Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered by** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Run #** | ${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Live URL** | [primeseva-mvp.web.app](https://primeseva-mvp.web.app) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Deployed successfully to Firebase Hosting" >> $GITHUB_STEP_SUMMARY
